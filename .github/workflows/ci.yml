name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build:
    name: 测试与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 静态检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 运行测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 构建产物冒烟检查
        run: npm run smoke
